name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      ffmpeg_repo:
        description: 'FFmpeg Repository URL'
        default: 'https://github.com/MartinEesmaa/FFmpeg.git'
      ffmpeg_branch:
        description: 'FFmpeg Branch'
        default: 'master'
      only_stage:
        description: 'Regex for ONLY_STAGE: 10-mingw|50-x264'
        required: false
        default: '10-mingw-std-threads|10-mingw|14-base|15-libicu|16-libiconv|17-freetype|17-gettext|17-harfbuzz|18-zlib|19-brotli|19-bzlib|19-xz|19-zstd|23-jbigkit|23-libffi|23-pcre2|25-fribidi|25-giflib|25-glib2|25-libjpeg-turbo|25-libpng|25-libxml2|25-openssl|26-pixman|26-fontconfig|26-libtiff|26-openjpeg|26-libssh|27-curl|27-libwebp|29-libarchive|34-cairo|35-harfbuzz|40-freetype|40-pango|45-lcms2|45-libtensorflow-test|47-leptonica-test|50-tesseract-test'
        # default: '.*'
      doClean:
        description: 'Clean cache before build (Full Rebuild)'
        type: boolean
        default: false
      use_lto:
        description: 'Enable LTO optimization'
        type: boolean
        default: false
      verbosity:
        description: 'Log Verbosity (1: Full, 0: Quiet)'
        required: false
        default: '1'
      debug_no_hash:
        description: 'Debug: Do not recalculate VARS_HASH (Preserve Docker cache)'
        type: boolean
        default: false
      skip_ffmpeg:
        description: 'Skip final FFmpeg compilation (Component test only)'
        type: boolean
        default: true
      dedupe_flags:
        description: 'Deduplicate LDFLAGS/LIBS (Disable if link errors occur)'
        type: boolean
        default: false
      use_wine:
        description: 'Enable Wine for tests/conftest (auto/on/off)'
        required: false
        default: 'auto'
      doRelease:
        description: 'Publish new release'
        type: boolean
        default: false
        required: false

env:
  DOCKER_BUILDKIT: 1
  TARGET: win64
  VARIANT: nonfree
  FFMPEG_REPO: ${{ github.event.inputs.ffmpeg_repo || 'https://github.com/MartinEesmaa/FFmpeg.git' }}
  FFMPEG_BRANCH: ${{ github.event.inputs.ffmpeg_branch || 'master' }}
  # Список для удаления лишних .git (в download.sh)
  GIT_PRESERVE_LIST: "ffmpeg|glib2|x264|x265|opus|vulkan-loader|mbedtls|pcre2|avisynth|openssl|pango|freetype|ilbc|libjxl|mbedtls|snappy|zimg|vmaf|dav1d|libplacebo"
  # Список для сохранения DLL (в run_stage.sh)
  DLL_PRESERVE_LIST: "openvino|torch|tensorflow|vulkan|amf|nvcodec|mfx|onevpl|glib2|leptonica-test|audiotoolbox|vapoursynth|vapoursynth-python-test"
  FFBUILD_VERBOSE: ${{ github.event.inputs.verbosity || '1' }}
  ONLY_STAGE: ${{ github.event.inputs.only_stage }}
  DEBUG_NO_HASH: ${{ github.event.inputs.debug_no_hash }}
  DEDUPE_FLAGS: ${{ github.event.inputs.dedupe_flags }}

jobs:
  build_all:
    name: Build FFmpeg Win64
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 🗑️ Nuke All Caches
        if: github.event.inputs.doClean == 'true'
        run: |
          gh extension install actions/gh-actions-cache || true
          echo "Purging all caches for ${{ github.ref }}..."
          gh cache delete --all --confirm --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-flags: --debug

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion subversion-tools nasm yasm jq bc

      - name: Set Image Names
        id: images
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "repo_lc=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT
          echo "base=ghcr.io/${REPO_LC}/base:latest" >> $GITHUB_OUTPUT
          echo "target_base=ghcr.io/${REPO_LC}/base-win64:latest" >> $GITHUB_OUTPUT

      - name: Login to Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      ## This cleans ~24Gb
      # - name: Free Disk Space
        # uses: jlumbroso/free-disk-space@main
        # with:
          # tool-cache: true
          # android: true
          # dotnet: true
          # haskell: true
          # large-packages: true
          # docker-images: true
          # swap-storage: false

      ## This cleans ~400Mb
      # - name: Final Deep Clean and Space Check
        # run: |
          # sudo ionice -c 3 rm -rf /usr/share/dotnet &
          # sudo ionice -c 3 rm -rf /usr/local/lib/android &
          # sudo ionice -c 3 rm -rf /opt/ghc &
          # sudo ionice -c 3 rm -rf "/usr/local/share/boost" &
          # sudo ionice -c 3 rm -rf "$AGENT_TOOLSDIRECTORY" &
          # docker image prune -af &
          # wait
          # echo "--- FINAL DISK SPACE REPORT ---"
          # df -h /
          # echo "-------------------------------"

      - name: Build Root Base Image
        uses: docker/build-push-action@v5
        with:
          context: images/base
          build-args: |
            CARGO_C_VERSION=0.10.20
          tags: ${{ steps.images.outputs.repo_lc }}/base:latest
          push: true
          load: false
          cache-from: type=gha,scope=base-root
          cache-to: type=gha,mode=max,scope=base-root

      - name: Build Base Win64 Image
        uses: docker/build-push-action@v5
        with:
          context: images/base-win64
          build-args: |
            GH_REPO=${{ steps.images.outputs.repo_lc }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          push: true
          load: false
          tags: ${{ steps.images.outputs.target_base }} 

      - name: Get Download Cache Key
        id: dl_cache
        run: |
          KEY=$(./util/get_dl_cache_tag.sh)
          echo "Cache Key: $KEY"
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Restore Source Cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/downloads
            .cache/ffmpeg
          key: dl-cache-${{ steps.dl_cache.outputs.key }}
          restore-keys: |
            dl-cache-${{ steps.dl_cache.outputs.key }}-
            dl-cache-

      - name: Run Download and Generate
        run: |
          if [[ "${{ github.event.inputs.doClean }}" == "true" ]]; then
            echo "### CLEAN BUILD REQUESTED ###"
            rm -rf .cache/downloads/* .cache/ffmpeg/* .cache/ccache/*
          fi
          export ONLY_STAGE="${{ github.event.inputs.only_stage }}"
          export DEBUG_NO_HASH="${{ github.event.inputs.debug_no_hash }}"
          export DEDUPE_FLAGS="${{ github.event.inputs.dedupe_flags }}"
          LTO_PARAM="nolto"
          [[ "${{ github.event.inputs.use_lto }}" == "true" ]] && LTO_PARAM="lto"
          SKIP_PARAM="false"
          [[ "${{ github.event.inputs.skip_ffmpeg }}" == "true" ]] && SKIP_PARAM="skip_ffmpeg"
          mkdir -p .cache/downloads .cache/ffmpeg
          chmod +x ./download.sh ./util/clean_cache.sh ./generate.sh
          ./download.sh
          ./util/clean_cache.sh
          ./generate.sh win64 nonfree "$LTO_PARAM" "$SKIP_PARAM" 

      - name: Inspect Dockerfile
        run: head -n 30 Dockerfile

      - name: Force Save Cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/downloads
            .cache/ffmpeg
          key: dl-cache-${{ steps.dl_cache.outputs.key }}

      - name: Prepare and Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: ffmpeg-final:local
          cache-from: type=gha,scope=ffmpeg-build
          cache-to: type=gha,mode=max,scope=ffmpeg-build
          build-contexts: |
            base-win64=docker-image://${{ steps.images.outputs.target_base }}
            ffmpeg_src=${{ github.workspace }}/.cache/ffmpeg
          outputs: type=local,dest=artifacts/
          provenance: false

      - name: Cleanup Old Caches
        if: always()
        continue-on-error: true
        run: |
          echo "### 🛡️ Smart Cache Cleanup Report" >> $GITHUB_STEP_SUMMARY
          echo "| Group | Kept | Deleted | Saved Size | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: | :--- |" >> $GITHUB_STEP_SUMMARY

          gh cache list --limit 1000 --json key,size_in_bytes > all_caches.json

          if [[ $(jq '. | length' all_caches.json) -eq 0 ]]; then
            echo "| All | 0 | 0 | 0 MB | No caches |" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          delete_cache_smart() {
            local key=$1
            local attempt=1
            while [ $attempt -le 3 ]; do
              RESPONSE=$(gh cache delete "$key" 2>&1)
              EXIT_CODE=$?

              if [ $EXIT_CODE -eq 0 ]; then return 0; fi

              if [[ "$RESPONSE" == *"403"* || "$RESPONSE" == *"rate limit"* ]]; then
                echo "Rate limit hit, sleeping 10s (Attempt $attempt)..." >&2
                sleep 10
                attempt=$((attempt + 1))
              else
                return 1
              fi
            done
          }
          export -f delete_cache_smart

          prefixes=("index-base-root" "index-base" "index-ffmpeg-build" "dl-cache" "buildkit-blob")
          grand_total_size=0
          grand_total_deleted=0

          for prefix in "${prefixes[@]}"; do
            data=$(jq -r --arg pref "$prefix" '.[] | select(.key | startswith($pref)) | "\(.key)|\(.size_in_bytes)"' all_caches.json | tail -n +16)

            if [ -n "$data" ]; then
              keys=$(echo "$data" | cut -d'|' -f1)
              sizes=$(echo "$data" | cut -d'|' -f2)

              group_size_bytes=$(echo "$sizes" | awk '{s+=$1} END {print s}')
              group_count=$(echo "$keys" | wc -l)

              echo "$keys" | xargs -P 4 -I {} bash -c 'delete_cache_smart "{}"'

              group_size_mb=$(echo "scale=2; $group_size_bytes / 1048576" | bc)
              grand_total_size=$((grand_total_size + group_size_bytes))
              grand_total_deleted=$((grand_total_deleted + group_count))

              echo "| $prefix | 15 | $group_count | ${group_size_mb} MB | ✅ Cleaned |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $prefix | ALL | 0 | 0 MB | 🧊 Kept all |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          others=$(jq -r '.[] | select(.key as $k | ["index-base", "index-ffmpeg", "dl-cache", "buildkit"] | map(contains($k)) | any | not) | "\(.key)|\(.size_in_bytes)"' all_caches.json | tail -n +21)
          if [ -n "$others" ]; then
             other_keys=$(echo "$others" | cut -d'|' -f1)
             other_sizes=$(echo "$others" | cut -d'|' -f2)
             other_count=$(echo "$other_keys" | wc -l)
             other_size_bytes=$(echo "$other_sizes" | awk '{s+=$1} END {print s}')

             echo "$other_keys" | xargs -P 4 -I {} bash -c 'delete_cache_smart "{}"'

             other_size_mb=$(echo "scale=2; $other_size_bytes / 1048576" | bc)
             grand_total_size=$((grand_total_size + other_size_bytes))
             grand_total_deleted=$((grand_total_deleted + other_count))
             echo "| Others | 20 | $other_count | ${other_size_mb} MB | 🗑️ Extra |" >> $GITHUB_STEP_SUMMARY
          fi

          final_gb=$(echo "scale=2; $grand_total_size / 1073741824" | bc)
          echo -e "\n**🚀 Total Purged:** $grand_total_deleted caches" >> $GITHUB_STEP_SUMMARY
          echo -e "**📦 Total Space Recovered:** ${final_gb} GB" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Final Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-win64-nonfree
          path: artifacts/*.7z
          if-no-files-found: error

      - name: Create Release
        if: ${{ github.event.inputs.doRelease == 'true' && success() }}
        run: |
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          TAGNAME="autobuild-$(date +'%Y-%m-%d-%H-%M')"
          (cd artifacts && sha256sum *.7z > checksums.sha256)
          gh release create "$TAGNAME" --target "${{ github.ref_name }}" \
            --title "Auto-Build $RELDATE" artifacts/*.7z artifacts/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
