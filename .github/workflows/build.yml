name: Build FFmpeg

on:
  workflow_dispatch:
    inputs:
      ffmpeg_repo:
        description: 'FFmpeg Repository URL'
        default: 'https://github.com/MartinEesmaa/FFmpeg-VVC.git'
      ffmpeg_branch:
        description: 'FFmpeg Branch'
        default: 'master'
      only_stage:
        description: 'Regex for ONLY_STAGE: 10-mingw|50-x264'
        required: false
        default: '05-libicu|06-libiconv|07-gettext|08-zlib|11-brotli|11-bzlib|11-xz|12-libffi|14-freetype|15-pcre2|16-glib2|16-libxml2|17-harfbuzz|37-libpng|37-libjpeg-turbo|37-giflib|37-libtiff|38-libwebp|39-fontconfig|39-fribidi|39-pixman|40-cairo|40-harfbuzz|41-freetype|43-pango|44-dav1d|44-svtav1|45-libavif|45-librsvg'
        # default: '06-libiconv|07-gettext|08-zlib|11-bzlib|12-libffi|15-pcre2|16-glib2'
        # default: '08-zlib|16-fftw3'
        # default: '.*'
      skip_ffmpeg:
        description: 'Skip FFmpeg compilation (Component test only)'
        type: boolean
        default: false
      cpu_arch:
        description: 'CPU march target (broadwell/x86-64-v3/znver3/native)'
        required: false
        default: 'broadwell'
      cpu_tune:
        description: 'CPU mtune target (broadwell/generic/native)'
        required: false
        default: 'broadwell'
      use_lto:
        description: 'Enable LTO optimization'
        type: boolean
        default: true
      use_avx512:
        description: 'Enable AVX-512 instructions'
        type: boolean
        default: false
      use_openmp:
        description: 'Enable OpenMP (Open Multi-Processing)'
        type: boolean
        default: false
      prefer_shared:
        description: 'Enable shared/Disable static'
        type: boolean
        default: false
      patch_ffmpeg:
        description: 'Enable FFmpeg custom patches'
        type: boolean
        default: true
      safe_config:
        description: 'Enable FFmpeg flags validation'
        type: boolean
        default: true
      dedupe_flags:
        description: 'Deduplicate LDFLAGS/LIBS'
        type: boolean
        default: true
      debug_no_hash:
        description: 'Static ENV_HASH (Preserve Docker cache)'
        type: boolean
        default: true
      clean_inactive:
        description: 'Clean sources for inactive components'
        type: boolean
        default: false
      freeSpace:
        description: 'Free some Disk Space before Build'
        type: boolean
        default: false
      # regularClean:
        # description: 'Clean old caches after build (Regular Cleaning)'
        # type: boolean
        # default: false
      doClean:
        description: 'Nuke all cache before build (Full Rebuild)'
        type: boolean
        default: false
      use_wine:
        description: 'Enable Wine for tests/conftest'
        type: boolean
        default: false
      verbosity:
        description: 'Log Verbosity (2: Full, 0: Quiet)'
        required: false
        default: '2'
      shaderc_update:
        description: 'Use own Shaderc DEPS file'
        type: boolean
        default: false
      doRelease:
        description: 'Publish new release'
        type: boolean
        default: false
        required: false
      older_ffnv:
        description: 'Install older ffnvcodec version'
        type: boolean
        default: false
        required: false
      dir_numbers:
        description: 'Ignore script folder numbering'
        type: boolean
        default: true
        required: false
      build_vino:
        description: 'Build OpenVino'
        type: boolean
        default: false
      skip_rsync:
        description: 'Skip rsync'
        type: boolean
        default: true
env:
  # Общие настройки локали
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # Системные настройки Docker
  DOCKER_BUILDKIT: 1
  DOCKER_BUILD_SUMMARY: false
  # Параметры сборки
  TARGET: win64
  VARIANT: nonfree
  # Списки исключений
  # Список для хранения .git от очистки (в download.sh)
  # Some patches apply only with git am...
  GIT_PRESERVE_LIST: >-
    ffmpeg|glib2|x264|x265|vulkan-loader|twolame|gme|mbedtls|pcre2|
    avisynth|openssl|pango|freetype|ilbc|libjxl|libvorbis|snappy|zimg|vmaf|dav1d|libplacebo
  # Список для сохранения DLL (в run_stage.sh)
  DLL_PRESERVE_LIST: >-
    openvino|torch|tensorflow|vulkan|shaderc|mfx|opencv|
    onevpl|leptonica|audiotoolbox|avisynth|vapoursynth|frei0r|nnedi3|whisper
  # Список для сохранения статики .a (в run_stage.sh)
  LIB_PRESERVE_LIST:
  # Список компонентов к которым strip не применяется (openvino,cuda-llvm)
  STRIP_EXCLUDE_LIST:
  # Преобразование boolean для bash-скриптов
  DEBUG_NO_HASH:  ${{ github.event.inputs.debug_no_hash  == 'true' && '1' || '0' }}
  DEDUPE_FLAGS:   ${{ github.event.inputs.dedupe_flags   == 'true' && '1' || '0' }}
  FFMPEG_PATCHES: ${{ github.event.inputs.patch_ffmpeg   == 'true' && '1' || '0' }}
  SKIP_FFMPEG:    ${{ github.event.inputs.skip_ffmpeg    == 'true' && '1' || '0' }}
  SAFE_CONFIGURE: ${{ github.event.inputs.safe_config    == 'true' && '1' || '0' }}
  USE_AVX512:     ${{ github.event.inputs.use_avx512     == 'true' && '1' || '0' }}
  USE_LTO:        ${{ github.event.inputs.use_lto        == 'true' && '1' || '0' }}
  USE_WINE:       ${{ github.event.inputs.use_wine       == 'true' && '1' || '0' }}
  USE_OPENMP:     ${{ github.event.inputs.use_openmp     == 'true' && '1' || '0' }}
  SHADERC_UPDATE: ${{ github.event.inputs.shaderc_update == 'true' && '1' || '0' }}
  CLEAN_INACTIVE: ${{ github.event.inputs.clean_inactive == 'true' && '1' || '0' }}
  PREFER_SHARED:  ${{ github.event.inputs.prefer_shared  == 'true' && '1' || '0' }}
  OLDER_FFNV:     ${{ github.event.inputs.older_ffnv     == 'true' && '1' || '0' }}
  DIR_NUMBERS:    ${{ github.event.inputs.dir_numbers    == 'true' && '1' || '0' }}
  BUILD_VINO:     ${{ github.event.inputs.build_vino     == 'true' && '1' || '0' }}
  SKIP_RSYNC:     ${{ github.event.inputs.skip_rsync     == 'true' && '1' || '0' }}
  # Маппинг Inputs -> Env для всех динамических значений
  FFMPEG_REPO:     ${{ github.event.inputs.ffmpeg_repo || 'https://github.com/MartinEesmaa/FFmpeg-VVC.git' }}
  FFMPEG_BRANCH:   ${{ github.event.inputs.ffmpeg_branch || 'master' }}
  ONLY_STAGE:      ${{ github.event.inputs.only_stage }}
  # строковые параметры
  FFBUILD_VERBOSE: ${{ github.event.inputs.verbosity || '1' }}
  CPU_ARCH:        ${{ github.event.inputs.cpu_arch || 'broadwell' }}
  CPU_TUNE:        ${{ github.event.inputs.cpu_tune || 'broadwell' }}

jobs:
  build_all:
    name: Build FFmpeg Win64
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 🗑️ Nuke All Caches
        if: github.event.inputs.doClean == 'true'
        run: |
          gh extension install actions/gh-actions-cache || true
          echo "Purging GitHub Actions Cache..."
          gh cache delete --succeed-on-no-caches --all --repo ${{ github.repository }}
          
          echo "Purging Docker BuildKit Cache Mounts..."
          # This specifically targets the 'prefix' and 'ccache' mounts
          docker builder prune --filter type=exec.cachemount --all --force
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          # buildkitd-flags: ${{ github.event.inputs.verbosity == '1' && '--debug' || '' }}

      - name: Install Host Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y subversion subversion-tools nasm yasm

      - name: Host Hardware Audit
        run: |
          echo "### 🖥️ Runner Hardware Audit" >> $GITHUB_STEP_SUMMARY

          MODEL=$(lscpu | grep "Model name" | cut -d':' -f2 | xargs)
          CORES=$(nproc)
          RAM=$(free -h | awk '/^Mem:/ {print $2}')
          echo "- **CPU Model**: $MODEL ($CORES vCPUs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Total RAM**: $RAM" >> $GITHUB_STEP_SUMMARY
          FREE_DISK=$(df -h / | awk 'NR==2 {print $4}')
          echo "- **Free Disk Space**: $FREE_DISK" >> $GITHUB_STEP_SUMMARY

          # Docker & Buildx
          DOCKER_VER=$(docker version --format '{{.Server.Version}}')
          BUILDX_VER=$(docker buildx version | awk '{print $2}')
          echo "- **Docker Server**: $DOCKER_VER" >> $GITHUB_STEP_SUMMARY
          echo "- **Buildx**: $BUILDX_VER" >> $GITHUB_STEP_SUMMARY

          # Architecture Check
          FLAGS=$(grep -m1 "flags" /proc/cpuinfo)
          if [[ "$FLAGS" =~ "avx2" && "$FLAGS" =~ "fma" ]]; then
            echo "- **Architecture**: ✅ x86-64-v3 ready" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Architecture**: ⚠️ Legacy" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set Image Names
        id: images
        run: |
          REPO_LC="${GITHUB_REPOSITORY,,}"
          echo "repo_lc=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT
          echo "base=ghcr.io/${REPO_LC}/base:latest" >> $GITHUB_OUTPUT
          echo "target_base=ghcr.io/${REPO_LC}/base-win64:latest" >> $GITHUB_OUTPUT

      - name: Login to Docker
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      ## This cleans ~24Gb
      - name: Free Disk Space
        if: github.event.inputs.freeSpace == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      # This cleans ~400Mb
      - name: Final Deep Clean and Space Check
        if: github.event.inputs.freeSpace == 'true'
        run: |
          sudo ionice -c 3 rm -rf /usr/share/dotnet &
          sudo ionice -c 3 rm -rf /usr/local/lib/android &
          sudo ionice -c 3 rm -rf /opt/ghc &
          sudo ionice -c 3 rm -rf "/usr/local/share/boost" &
          sudo ionice -c 3 rm -rf "$AGENT_TOOLSDIRECTORY" &
          docker image prune -af &
          wait
          echo "--- FINAL DISK SPACE REPORT ---"
          df -h /
          echo "-------------------------------"

      # Allocates 32Gb swap instead of 2Gb when using LTO
      - name: Setup Swap Space
        if: github.event.inputs.use_lto == 'true'
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo dd if=/dev/zero of=/swapfile bs=1M count=32768
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show

      - name: Check if base rebuild needed
        id: base_check
        run: |
          BASE_HASH=$(sha256sum images/base/Dockerfile images/base/*.sh 2>/dev/null | sha256sum | cut -c1-16)
          echo "rebuild=${{ github.event.inputs.doClean }}" >> $GITHUB_OUTPUT
          echo "base_hash=$BASE_HASH" >> $GITHUB_OUTPUT

      - name: Build Root Base Image
        if: steps.base_check.outputs.rebuild == 'true' || steps.base_check.outputs.base_hash != steps.cached_base_check.outputs.base_hash
        uses: docker/build-push-action@v7
        with:
          context: images/base
          build-args: |
            CARGO_C_VERSION=0.10.22
          tags: ${{ steps.images.outputs.repo_lc }}/base:latest
          push: true
          load: false
          cache-from: type=gha,scope=base-root
          cache-to: type=gha,mode=max,scope=base-root

      - name: Compute base-win64 hash
        id: win64_hash
        run: |
          HASH=$(find images/base-win64 -type f | sort | xargs sha256sum | sha256sum | cut -c1-16)
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Build Base Win64 Image
        if: steps.base_check.outputs.rebuild == 'true' || steps.win64_hash.outputs.hash != steps.cached_win64_hash.outputs.hash
        uses: docker/build-push-action@v7
        with:
          context: images/base-win64
          build-args: |
            GH_REPO=${{ steps.images.outputs.repo_lc }}
            CPU_ARCH=${{ env.CPU_ARCH }}
            CPU_TUNE=${{ env.CPU_TUNE }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
          push: true
          load: false
          tags: ${{ steps.images.outputs.target_base }}

      - name: Get Download Cache Key
        id: dl_cache
        run: |
          KEY=$(./util/get_dl_cache_tag.sh)
          echo "Cache Key: $KEY"
          echo "key=$KEY" >> $GITHUB_OUTPUT

      - name: Restore Source Cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/downloads
            .cache/ffmpeg
          key: dl-cache-${{ steps.dl_cache.outputs.key }}-${{ github.run_id }}
          restore-keys: |
            dl-cache-${{ steps.dl_cache.outputs.key }}-
            dl-cache-

      - name: Run Download and Generate
        run: |
          [[ "${{ github.event.inputs.doClean }}" == "true" ]] && rm -rf .cache/{downloads,ffmpeg,ccache}/* && echo "### CLEAN BUILD REQUESTED ###"

          chmod -R u+r patches/ || true
          mkdir -p .cache/downloads .cache/ffmpeg .cache/tmp
          chmod -R u+w .cache/ || true
          find scripts.d util addins images variants -name "*.sh" -exec sed -i 's/\r$//' {} +
          chmod +x ./download.sh ./util/*.sh ./generate.sh
          ./download.sh
          ./util/clean_cache.sh
          ./generate.sh "$TARGET" "$VARIANT"

      - name: Verify FFmpeg Source
        run: |
          if [[ ! -f ".cache/ffmpeg/configure" ]]; then
            echo "ERROR: FFmpeg source not found at .cache/ffmpeg/configure" >&2
            exit 1
          fi
          echo "FFmpeg source OK: $(cat .cache/ffmpeg/VERSION 2>/dev/null || echo 'version unknown')"

      - name: Inspect Dockerfile
        run: head -n 50 Dockerfile

      - name: Force Save Cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/downloads
            .cache/ffmpeg
          key: dl-cache-${{ steps.dl_cache.outputs.key }}-${{ github.run_id }}

      - name: Prepare Cache Directories
        run: |
          mkdir -p .cache/components .cache/shared_prefix .cache/shared_dest

      # This step checks GitHub Cache for individual component tarballs
      - name: Restore Component Caches
        uses: actions/cache/restore@v5
        with:
          path: .cache/components
          key: win64-${{ env.CPU_ARCH }}-${{ env.VARIANT }}-components-${{ github.run_id }}
          restore-keys: |
            win64-${{ env.CPU_ARCH }}-${{ env.VARIANT }}-components-

      - name: Run Component Build Loop
        run: |
          chmod +x ./util/build_dispatcher.sh
          ./util/build_dispatcher.sh

      - name: Save Component Caches
        uses: actions/cache/save@v5
        with:
          path: .cache/components
          key: win64-${{ env.CPU_ARCH }}-${{ env.VARIANT }}-components-${{ github.run_id }}

      - name: Final FFmpeg Compilation
        if: env.SKIP_FFMPEG != '1'
        run: |
          # Ensure the shared prefix is merged into the expected location for the final build
          # The final build expects files in /opt/ffbuild, which is now populated by the dispatcher
          rsync -a .cache/shared_prefix/ /opt/ffbuild/ 2>/dev/null || true

          # Run the final build using the existing Docker logic (which is now much faster)
          docker run --rm \
            --mount type=bind,source=.cache/ffmpeg,target=/builder/ffbuild/ffmpeg \
            --mount type=bind,source=/opt/ffbuild,target=/opt/ffbuild \
            ghcr.io/${GITHUB_REPOSITORY,,}/base-win64:latest \
            /builder/build.sh "$TARGET" "$VARIANT"

      - name: Cleanup Old Caches
        if: github.event.inputs.regularClean == 'true' && !cancelled()
        # if: always() && !cancelled()
        continue-on-error: true
        run: |
          echo "### 🛡️ Smart Cache Cleanup Report" >> $GITHUB_STEP_SUMMARY
          echo "| Group | Kept | Deleted | Saved Size | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :---: | :---: | :--- |" >> $GITHUB_STEP_SUMMARY

          gh cache list --limit 1000 --json key,sizeInBytes > all_caches.json

          if [[ $(jq '. | length' all_caches.json) -eq 0 ]]; then
            echo "| All | 0 | 0 | 0 MB | No caches |" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          prefixes=("index-base-root" "index-base" "index-ffmpeg-build" "dl-cache" "buildkit-blob")
          grand_total_size=0
          grand_total_deleted=0

          for prefix in "${prefixes[@]}"; do
            # # Keep newest 15 entries, delete the rest
            data=$(jq -r --arg pref "$prefix" \
                '[.[] | select(.key | startswith($pref))] | sort_by(.createdAt) | reverse | .[50:] | .[] | "\(.key)|\(.sizeInBytes)"' \
                all_caches.json)

            if [ -n "$data" ]; then
              keys=$(echo "$data" | cut -d'|' -f1)
              sizes=$(echo "$data" | cut -d'|' -f2)

              group_size_bytes=$(echo "$sizes" | awk '{s+=$1} END {print s}')
              group_count=$(echo "$keys" | wc -l)

              echo "$keys" | xargs -P 4 -I {} bash -c '
                  key="{}"
                  attempt=1
                  while [ $attempt -le 3 ]; do
                      RESPONSE=$(gh cache delete "$key" 2>&1)
                      [ $? -eq 0 ] && exit 0
                      if echo "$RESPONSE" | grep -qE "403|rate limit"; then
                          sleep 10
                          attempt=$((attempt + 1))
                      else
                          exit 1
                      fi
                  done
              '

              group_size_mb=$(echo "scale=2; $group_size_bytes / 1048576" | bc)
              grand_total_size=$((grand_total_size + group_size_bytes))
              grand_total_deleted=$((grand_total_deleted + group_count))

              echo "| $prefix | 50 | $group_count | ${group_size_mb} MB | ✅ Cleaned |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $prefix | ALL | 0 | 0 MB | 🧊 Kept all |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          others=$(jq -r '.[] | select(.key as $k | ["index-base-root", "index-base", "index-ffmpeg-build", "dl-cache", "buildkit-blob"] | map($k | startswith(.)) | any | not) | "\(.key)|\(.sizeInBytes)"' all_caches.json | tail -n +41)
          if [ -n "$others" ]; then
             other_keys=$(echo "$others" | cut -d'|' -f1)
             other_sizes=$(echo "$others" | cut -d'|' -f2)
             other_count=$(echo "$other_keys" | wc -l)
             other_size_bytes=$(echo "$other_sizes" | awk '{s+=$1} END {print s}')

             echo "$other_keys" | xargs -P 4 -I {} bash -c '
                  key="{}"
                  attempt=1
                  while [ $attempt -le 3 ]; do
                      RESPONSE=$(gh cache delete "$key" 2>&1)
                      [ $? -eq 0 ] && exit 0
                      if echo "$RESPONSE" | grep -qE "403|rate limit"; then
                          sleep 10
                          attempt=$((attempt + 1))
                      else
                          exit 1
                      fi
                  done
              '

             other_size_mb=$(echo "scale=2; $other_size_bytes / 1048576" | bc)
             grand_total_size=$((grand_total_size + other_size_bytes))
             grand_total_deleted=$((grand_total_deleted + other_count))
             echo "| Others | 40 | $other_count | ${other_size_mb} MB | 🗑️ Extra |" >> $GITHUB_STEP_SUMMARY
          fi

          printf '\n**🚀 Total Purged:** %d caches\n' "$grand_total_deleted" >> $GITHUB_STEP_SUMMARY
          final_gb=$(echo "scale=2; $grand_total_size / 1073741824" | bc)
          printf '**📦 Total Space Recovered:** %s GB\n' "$final_gb" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Final Artifacts
        if: ${{ github.event.inputs.skip_ffmpeg != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-win64-nonfree.zip
          path: |
            artifacts/*.7z
            artifacts/*.txt
            artifacts/config.log
          if-no-files-found: error

      - name: Create Release
        if: ${{ github.event.inputs.doRelease == 'true' && success() }}
        run: |
          RELDATE="$(date +'%Y-%m-%d %H:%M')"
          TAGNAME="autobuild-$(date +'%Y-%m-%d-%H-%M')"
          (cd artifacts && sha256sum *.7z > checksums.sha256)
          gh release create "$TAGNAME" --target "${{ github.ref_name }}" \
            --title "Auto-Build $RELDATE" artifacts/*.7z artifacts/checksums.sha256
        env:
          GITHUB_TOKEN: ${{ github.token }}
