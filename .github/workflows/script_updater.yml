name: Auto-Bump Dependencies

on:
  # schedule:
    # - cron: '0 0 * * 0' # Каждое воскресенье в полночь
  workflow_dispatch:

env:
  # Список исключений для обновления
  UPDATE_PRESERVE_LIST: "quiche mbedtls"
  TARGET: win64
  VARIANT: nonfree
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  FFBUILD_VERBOSE: 1 # 2

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false 

      - name: Run Update Script
        run: |
          chmod +x util/update_scripts.sh
          ./util/update_scripts.sh

        # Проверяем наличие изменений в папке scripts.d
      - name: Check for changes
        id: git-check
        run: |
          git status --porcelain
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected!"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes found."
          fi

      - name: Clear Git Authorization Extraheaders
        if: steps.git-check.outputs.changed == 'true'
        run: |
          echo "=== Removing potential duplicate authorization headers from local git config ==="
          git config --local --unset http.https://github.com/.extraheader || true
          git config --local --unset-all credential.helper || true

          echo "=== Hard-fixing Git attributes and CRLF blocks ==="
          git config --local core.autocrlf false

          git checkout -- patches/bs2b/buildonlylibrary.patch || true

          if [[ -f "patches/bs2b/buildonlylibrary.patch" ]]; then
            git update-index --assume-unchanged patches/bs2b/buildonlylibrary.patch || true
            echo "Patch file locked in index."
          fi

          echo "Git local config and working tree thoroughly sanitized."

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump component versions"
          title: "🤖 Auto-Update Library Commits"
          body: |
            Automated dependency update. 
            Checked with `bash -n` to ensure no syntax errors.
          branch: auto-bump-deps
          base: personal
          delete-branch: true
